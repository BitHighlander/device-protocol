name: Build & Publish

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

permissions:
  id-token: write
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Production dependency audit
        run: npm audit --omit=dev
      - name: Upload lib artifact
        uses: actions/upload-artifact@v4
        with:
          name: lib
          path: lib/

  publish-prerelease:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - name: Set pre-release version
        run: |
          BASE=$(node -p "require('./package.json').version")
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          npm version "${BASE}-pre.${SHORT_SHA}" --no-git-tag-version
      - name: Publish pre-release (OIDC)
        run: |
          unset NODE_AUTH_TOKEN
          npm publish --provenance --access public --tag pre

  publish-stable:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Publish to npm (OIDC)
        run: |
          unset NODE_AUTH_TOKEN
          PACKAGE=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "${PACKAGE}@${VERSION}" version >/dev/null 2>&1; then
            echo "${PACKAGE}@${VERSION} is already published; skipping"
          else
            npm publish --provenance --access public
          fi
      - name: Create git tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "v${VERSION} already exists; skipping"
          else
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
          fi
